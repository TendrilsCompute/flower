[workspace]
resolver = "3"
members = ["flower", "flower_foss", "petal"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
brotli = "9.0.0"
rmp-serde = "1.3.1"
tokio = { version = "1.53.1", features = [ "macros", "rt", "process", "fs", "sync", "io-util" ] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
toml = "1.1.6"
serde = { version = "1.0.229", features = [ "derive" ] }
futures = "0.3"
clap = { version = "4.6.7", features = [ "derive" ] }
merkle_hash = "3.9.0"
camino = { version = "1.2", features = [ "serde1" ] }
which = "8.0.6"
thiserror = "2.0.21"
